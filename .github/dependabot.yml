version: 2
updates:
  # Node base image (Dockerfile build + runtime stages). Exact tag + digest
  # pins let Dependabot open patch/minor and same-tag digest refresh PRs.
  # Merged manually; major versions are upgraded deliberately.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "node"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
